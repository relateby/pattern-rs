# Build and smoke-test the Python distribution: one abi3 wheel per platform
# (cibuildwheel) plus an sdist. Produces artifacts only and never publishes.
#
# Called by publish.yml before the PyPI upload, and runnable on its own
# (workflow_dispatch, or on pull requests that touch Python packaging) to check
# that the release artifacts still build and install.
name: Python wheels

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/python-wheels.yml'
      - 'python/packages/relateby/**'
      - 'crates/pattern-core/**'
      - 'crates/gram-codec/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/release/python-smoke.py'

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 rather than ubuntu-latest: ubuntu-latest moves on and the
        # newer images lack the older Pythons that setup-python must provide below.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Configuration (one abi3 build per platform, manylinux, macOS target,
      # Windows 64-bit only) lives in [tool.cibuildwheel] in
      # python/packages/relateby/pyproject.toml.
      - name: Build wheel
        run: |
          python -m pip install cibuildwheel==2.23.3
          python -m cibuildwheel --output-dir wheelhouse python/packages/relateby
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build sdist and install from it
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist --outdir sdist python/packages/relateby
          ls -l sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: sdist/*.tar.gz
          if-no-files-found: error
      # Compiles the Rust crates, so it proves the sdist is complete.
      - name: Install from the sdist and smoke test
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install sdist/*.tar.gz
          /tmp/sdist-venv/bin/python -I scripts/release/python-smoke.py --expect-distribution relateby-pattern

  # The same gate publish.yml applies before uploading: the artifacts must pass
  # `twine check` (it rejects, for example, an sdist without PKG-INFO).
  check-artifacts:
    name: Check artifact metadata
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: twine check
        run: |
          python -m pip install twine
          ls -l dist
          twine check dist/*

  smoke-wheels:
    name: Smoke (${{ matrix.os }}, py${{ matrix.python }})
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        python: ['3.9', '3.13']
        include:
          # The oldest supported Python (requires-python >=3.8). setup-python has
          # no 3.8 for the arm64 runners.
          - os: ubuntu-24.04
            python: '3.8'
          - os: windows-latest
            python: '3.8'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse
      - name: Install the built wheel and smoke test
        shell: bash
        run: |
          ls -l wheelhouse
          python -m pip install --no-index --find-links wheelhouse relateby-pattern
          python scripts/release/python-smoke.py --expect-distribution relateby-pattern
