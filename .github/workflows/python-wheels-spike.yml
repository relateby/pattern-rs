# SPIKE (issue #94): build abi3 wheels for several platforms with cibuildwheel
# and smoke-test them on several Python versions. Builds artifacts only; it
# does not publish anywhere.
name: Python wheels (spike)

on:
  push:
    branches: ['spike/pypi-wheels']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build wheels
        run: |
          python -m pip install cibuildwheel==2.23.3
          python -m cibuildwheel --output-dir wheelhouse python/packages/relateby
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  smoke:
    name: Smoke (${{ matrix.os }}, py${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        python: ['3.9', '3.13']
        include:
          - os: ubuntu-latest
            python: '3.8'
          - os: windows-latest
            python: '3.8'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse
      - name: Install the built wheel and smoke test
        shell: bash
        run: |
          ls -l wheelhouse
          python -m pip install --no-index --find-links wheelhouse relateby-pattern
          python scripts/release/python-smoke.py --expect-distribution relateby-pattern
