[project]
name = "relateby-pattern"
version = "0.7.1"
description = "Combined Python distribution for relateby.pattern and relateby.gram"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.8,<3.14"
keywords = [
    "pattern",
    "gram",
    "data-structure",
    "graph",
    "notation",
    "relateby",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/relateby/pattern-rs"
Repository = "https://github.com/relateby/pattern-rs"
Documentation = "https://github.com/relateby/pattern-rs/tree/main/docs"

[project.optional-dependencies]
# Development: testing and building from source
# Install with: pip install relateby-pattern[dev]
dev = [
    "maturin>=1.0,<2.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "twine>=5.0",
    "pdoc>=14.0",
]
# All optional dependencies (add new extras above and reference them here)
# Install with: pip install relateby-pattern[all]
all = [
    "relateby-pattern[dev]",
]

[build-system]
requires = ["maturin>=1.0,<2.0", "tomli>=2.0; python_version<'3.11'"]
build-backend = "relateby_build"
backend-path = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "public_api: validates the supported relateby.pattern and relateby.gram package surface",
]

# Release wheels are built with cibuildwheel, run from the repository root:
#   cibuildwheel --output-dir wheelhouse python/packages/relateby
# (see .github/workflows/python-wheels.yml). The extension modules use the stable
# ABI (pyo3 abi3-py38), so one interpreter build per platform produces a
# cp38-abi3 wheel that works on every supported Python.
[tool.cibuildwheel]
build = "cp312-*"
skip = "*-musllinux_*"
build-verbosity = 1
test-command = "python -c \"import relateby.pattern, relateby.gram; print(relateby.gram.round_trip('(a)-[:KNOWS]->(b)'))\""

[tool.cibuildwheel.linux]
archs = ["native"]
# Pin the old-glibc baseline (manylinux_2_17 wheels) rather than rely on the
# cibuildwheel default, which changes between cibuildwheel releases.
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
